<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
    <title>Carta · Coffee Hempany</title>
 
    <!-- FUENTES DE GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/api.js?v=4"></script>
 
    <!-- ESTILOS -->
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
 
<body>
 
    <!-- CABECERA (se llena con js/layout.js) -->
    <header class="barra" id="cabecera"></header>
 
    <main>
 
        <section class="pagina">
 
            <h1>
                Carta
            </h1>
 
            <!-- LISTA DE PRODUCTOS (se llena con js/menu.js) -->
            <ul class="productos" id="lista-productos"></ul>
 
 
            <!-- TOTAL Y BOTÓN CONTINUAR -->
            <div class="resumen-fijo">
 
                <span>
                    Total: <b id="total">$0</b>
                </span>
 
                <button class="btn" id="btn-continuar" disabled>
                    Continuar
                </button>
 
            </div>
 
        </section>
 
    </main>
 
    <!-- PIE DE PÁGINA (se llena con js/layout.js) -->
    <footer class="pie" id="pie"></footer>
 
    <!-- SCRIPTS (el orden importa, no lo cambies) -->
    <script src="js/datos.js?v=4"></script>
    <script src="js/layout.js?v=4"></script>
    <script src="js/menu.js?v=4"></script>
 
</body>
</html>
